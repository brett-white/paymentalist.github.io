# Deploys each pull request to a temporary Firebase Hosting preview channel.
# Authenticates with Workload Identity Federation, so no service account key is stored.
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    # PRs from forks can't get an identity token, so only run for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npx --yes firebase-tools hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --expires 7d --project paymentalist-site --non-interactive
